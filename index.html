<style>
/* Pendulum brand: Tolopea #32253e, Tranquil #dae9eb, Turquoise #1de7df, Teal #096f6b; Outfit for headings and
   numbers, Nunito Sans for text (both self-hosted from @fontsource, OFL). A Tolopea band carries the nav and the
   treasury facts; proposals sit below as rows that open in place. Dark surfaces (band, footer) redefine the tokens. */
@font-face { font-family: Outfit; font-weight: 500; font-display: swap; src: url(fonts/outfit-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Outfit; font-weight: 600; font-display: swap; src: url(fonts/outfit-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito Sans"; font-weight: 400; font-display: swap; src: url(fonts/nunito-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito Sans"; font-weight: 700; font-display: swap; src: url(fonts/nunito-sans-latin-700-normal.woff2) format("woff2"); }

:root {
  --tolopea: #32253e; --turquoise: #1de7df;
  --page: #eaf2f3; --surface: #ffffff; --sunken: #f1f6f7; --line: #dbe6e8; --ink: #32253e; --muted: #685d74;
  --accent: #32253e; --accent-ink: #ffffff; --link: #096f6b; --focus: #096f6b;
  --for: #13865b; --for-soft: #def3e9; --against: #c23a4d; --against-soft: #fbe4e7; --abstain: #9a92a6;
  --warn: #8a5a00; --warn-soft: #fbefd6; --pending: #6a5682; --pending-soft: #efeaf5; --live: #075f5b; --live-soft: #d3f7f4;
  --band: #32253e; --base: #3b7bff;
  --font-head: Outfit, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ui: "Nunito Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #17111c; --surface: #211a29; --sunken: #2a2233; --line: #372d42; --ink: #efebf3; --muted: #a99fb5;
    --accent: #1de7df; --accent-ink: #32253e; --link: #1de7df; --focus: #1de7df;
    --for: #43d293; --for-soft: #173327; --against: #f27486; --against-soft: #3b1d24; --abstain: #8e869a;
    --warn: #f0c46c; --warn-soft: #33291a; --pending: #c3b2d8; --pending-soft: #2f2639; --live: #1de7df; --live-soft: #123536;
    --band: #2a1f34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #17111c; --surface: #211a29; --sunken: #2a2233; --line: #372d42; --ink: #efebf3; --muted: #a99fb5;
  --accent: #1de7df; --accent-ink: #32253e; --link: #1de7df; --focus: #1de7df;
  --for: #43d293; --for-soft: #173327; --against: #f27486; --against-soft: #3b1d24; --abstain: #8e869a;
  --warn: #f0c46c; --warn-soft: #33291a; --pending: #c3b2d8; --pending-soft: #2f2639; --live: #1de7df; --live-soft: #123536;
  --band: #2a1f34;
  color-scheme: dark;
}
/* Light-on-Tolopea surfaces, in both themes. */
.top, .hero, .foot {
  --ink: #ffffff; --muted: #c6bdd0; --line: rgb(255 255 255 / 0.14); --surface: rgb(255 255 255 / 0.06); --sunken: rgb(255 255 255 / 0.09);
  --accent: #1de7df; --accent-ink: #32253e; --link: #1de7df; --focus: #1de7df;
  background: var(--band); color: var(--ink);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15.5px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--font-head); font-weight: 600; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.3rem; letter-spacing: -0.01em; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--link); text-underline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.dim { opacity: 0.7; }
.break { word-break: break-all; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 14px; color: var(--ink); text-decoration: none; }
.brand .logo { height: 30px; width: auto; flex: none; display: block; }
.brand-app { font-family: var(--font-head); font-weight: 500; font-size: 1.05rem; color: var(--muted); padding-left: 14px; border-left: 1px solid var(--line); line-height: 1.6; }
.brand:hover .brand-app { color: var(--ink); }
.net { display: inline-flex; align-items: center; gap: 7px; font: 500 0.8rem/1 var(--font-head); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; }
.net::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--base); box-shadow: 0 0 0 2px rgb(59 123 255 / 0.25); }
.wallet { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.acct { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); font-size: 0.86rem; }

/* Avatars: a gradient derived from the address, so the same address always looks the same. */
.av { display: inline-block; flex: none; width: 1.25em; height: 1.25em; border-radius: 50%; vertical-align: -0.28em; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }
.acct .av { width: 26px; height: 26px; }
.who-line { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }

/* Hero */
.hero { position: relative; overflow: hidden; }
.hero-in { position: relative; z-index: 1; padding-block: 44px 34px; display: grid; gap: 30px; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 2.9rem); letter-spacing: -0.025em; }
.hero-text { display: grid; gap: 12px; max-width: 34rem; }
.hero-text p { color: var(--muted); font-size: 1.06rem; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.facts div { min-width: 0; padding: 16px 16px 0 0; }
.facts div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.facts dt { font-size: 0.82rem; color: var(--muted); }
.facts dd { margin: 4px 0 0; font: 600 1.4rem/1.2 var(--font-head); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.facts dd .unit, .stats dd .unit { font: 500 0.78rem var(--font-head); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.mark { position: absolute; z-index: 0; right: max(-30px, calc(50% - 610px)); top: -56px; height: 250px; width: auto; color: var(--turquoise); opacity: 0.16; transform-origin: 50% 0; animation: swing 3.2s cubic-bezier(0.36, 0, 0.3, 1) 0.2s both; pointer-events: none; }
@keyframes swing { 0% { transform: rotate(11deg); } 28% { transform: rotate(-7deg); } 52% { transform: rotate(4deg); } 74% { transform: rotate(-1.6deg); } 100% { transform: rotate(0); } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 17px; font: 500 0.9rem/1.3 var(--font-head); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.12); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.top .btn.warn { background: #f0c46c; border-color: #f0c46c; color: var(--tolopea); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: transparent; }
.btn.small { padding: 5px 12px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.vote-for { border-color: var(--for); color: var(--for); }
.btn.vote-against { border-color: var(--against); color: var(--against); }
.btn.vote-abstain { border-color: var(--abstain); color: var(--muted); }
.btn.vote-for:hover:not(:disabled) { background: var(--for); color: var(--surface); border-color: var(--for); }
.btn.vote-against:hover:not(:disabled) { background: var(--against); color: var(--surface); border-color: var(--against); }
.btn.vote-abstain:hover:not(:disabled) { background: var(--abstain); color: var(--surface); border-color: var(--abstain); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Page */
.page { display: grid; gap: 40px; padding-block: 36px 64px; }
section { min-width: 0; }
.sec-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head .btn { margin-left: auto; }
.scan { font-size: 0.82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.scan .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--link); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 16px; }

/* Voting power */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 0.82rem; color: var(--muted); }
.stats dd { margin: 4px 0 0; font: 600 1.5rem/1.2 var(--font-head); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.stats dd.who { font: 600 1rem/1.4 var(--font-ui); padding-top: 6px; }
.note { border-radius: var(--r-sm); padding: 12px 16px; font-size: 0.92rem; display: grid; gap: 10px; }
.note.warn { background: var(--warn-soft); }
.note.warn strong { color: var(--warn); }
.note.info { background: var(--sunken); }
.note.bad { background: var(--against-soft); }
.note.good { background: var(--for-soft); }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.inline-form label { flex: 1 1 260px; }
label { display: grid; gap: 6px; font-size: 0.86rem; font-weight: 700; min-width: 0; }
label .muted { font-weight: 400; }
input, textarea, select { font: 0.94rem var(--font-ui); padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--sunken); color: var(--ink); width: 100%; min-width: 0; }
input.mono, textarea.mono { font-family: var(--font-mono); font-size: 0.84rem; }
textarea { resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--focus); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.suffix { position: relative; }
.suffix input { padding-right: 52px; }
.suffix span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--muted); pointer-events: none; }

/* Proposals */
.list { display: grid; gap: 12px; }
.prop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prop.open { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.prop-head { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 250px); gap: 14px 32px; align-items: center; width: 100%; padding: 20px 24px; cursor: pointer; }
.prop-head:hover { background: color-mix(in srgb, var(--sunken) 60%, transparent); }
.prop-head:hover .prop-title { color: var(--link); }
.prop-head:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: var(--r); }
.prop-main { display: grid; gap: 8px; min-width: 0; }
.prop-top { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.prop-time { font-size: 0.85rem; color: var(--muted); }
.prop-title { font: 600 1.12rem/1.3 var(--font-head); letter-spacing: -0.005em; overflow-wrap: anywhere; transition: color 0.15s; }
.prop-by { font-size: 0.84rem; color: var(--muted); }
.prop-votes { display: grid; gap: 7px; font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.pv-line { display: flex; justify-content: space-between; gap: 10px; }
.pv-line b { color: var(--ink); font-weight: 700; }
.k { display: inline-flex; align-items: center; gap: 6px; }
.k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.k.for::before { background: var(--for); } .k.against::before { background: var(--against); } .k.abstain::before { background: var(--abstain); }
.k.q::before { width: 2px; height: 10px; border-radius: 0; background: var(--ink); }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 0.78rem/1 var(--font-head); padding: 5px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.s0 { background: var(--pending-soft); color: var(--pending); }
.chip.s1 { background: var(--live-soft); color: var(--live); }
.chip.s1::before { animation: pulse 1.6s ease-in-out infinite; }
.chip.s3 { background: var(--against-soft); color: var(--against); }
.chip.s4, .chip.s7 { background: var(--for-soft); color: var(--for); }
.chip.s5 { background: var(--warn-soft); color: var(--warn); }
@keyframes pulse { 50% { opacity: 0.3; } }

.bar { position: relative; display: flex; gap: 2px; height: 8px; border-radius: 4px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); }
.bar .seg { height: 100%; border-radius: 4px; }
.bar .seg[style^="width:0%"] { display: none; }
.bar .for { background: var(--for); } .bar .abstain { background: var(--abstain); } .bar .against { background: var(--against); }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

.prop-body { border-top: 1px solid var(--line); padding: 24px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px 32px; }
.col { display: grid; gap: 26px; align-content: start; min-width: 0; }
.col.side { background: var(--sunken); border-radius: var(--r-sm); padding: 20px; gap: 22px; }
.blk { display: grid; gap: 10px; min-width: 0; }
.actions { margin: 0; padding-left: 20px; display: grid; gap: 12px; }
.actions li { padding-left: 2px; }
.actions li::marker { font-family: var(--font-head); font-weight: 600; color: var(--muted); }
.actions li > p { overflow-wrap: anywhere; }
.addr { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted); }
.addr:hover { color: var(--link); border-color: var(--link); }
details.raw { margin-top: 6px; font-size: 0.84rem; }
details.raw summary { cursor: pointer; color: var(--muted); }
details.raw dl { margin: 8px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; background: var(--sunken); border-radius: var(--r-sm); padding: 10px 12px; }
details.raw dt { color: var(--muted); }
details.raw dd { margin: 0; font-family: var(--font-mono); font-size: 0.78rem; word-break: break-all; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.95rem; line-height: 1.65; max-height: 360px; overflow: auto; max-width: 68ch; }

.res { display: grid; gap: 9px; }
.res-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 0.87rem; font-variant-numeric: tabular-nums; }
.res-row .track { height: 6px; border-radius: 3px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.res-row .fill { height: 100%; border-radius: 3px; }
.res-row .num { text-align: right; white-space: nowrap; }
.res-row .num span { color: var(--muted); margin-left: 6px; display: inline-block; min-width: 3.2em; }
.verdict { font-size: 0.9rem; font-weight: 700; }

.you { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px; display: grid; gap: 10px; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl li { position: relative; padding: 0 0 14px 24px; font-size: 0.88rem; display: grid; }
.tl li::before { content: ""; position: absolute; left: 3px; top: 5px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.tl li::after { content: ""; position: absolute; left: 8px; top: 19px; bottom: 1px; width: 2px; background: var(--line); margin-left: -1px; }
.tl li:last-child::after { display: none; }
.tl li.done::before { background: var(--ink); border-color: var(--ink); }
.tl li.now::before { border-color: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 22%, transparent); }
.tl li.now > span:first-child { font-weight: 700; }
.tl .t { color: var(--muted); font-size: 0.82rem; }

.d-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 0.84rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }

/* Composer */
.composer { gap: 18px; }
.c-actions { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: act; }
.c-action { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 10px; background: var(--sunken); }
.c-action input, .c-action textarea, .c-action select { background: var(--surface); }
.c-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 10px; }
.c-row { display: flex; gap: 8px; align-items: end; }
.c-row label { flex: 1; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.checks .i { font-weight: 700; text-align: center; }
.checks .ok .i { color: var(--for); } .checks .no .i { color: var(--against); } .checks .warn .i { color: var(--warn); }
.preview { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }

/* Footer */
.foot-in { padding-block: 40px 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px 48px; font-size: 0.9rem; }
.foot h2 { font-size: 1.05rem; }
.rules { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; color: var(--muted); }
.rules b { color: var(--ink); }
.contracts { width: 100%; border-collapse: collapse; margin-top: 12px; }
.contracts td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.contracts td:first-child { color: var(--muted); padding-right: 14px; white-space: nowrap; }
.foot-note { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; }
.foot-note .logo { height: 22px; width: auto; color: var(--ink); }

/* Toast and wallet picker */
.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); background: var(--tolopea); color: #ffffff; border-radius: 14px; padding: 13px 14px 13px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 32px rgb(23 17 28 / 0.3); font-size: 0.92rem; }
.toast p { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast a { color: var(--turquoise); font-weight: 700; }
.toast.bad { background: #a32b3d; }
.toast.bad a { color: inherit; }
.toast .x { all: unset; cursor: pointer; padding: 2px 6px; opacity: 0.8; font-size: 1.15rem; line-height: 1; }
.picker { position: fixed; inset: 0; z-index: 30; background: rgb(23 17 28 / 0.55); display: grid; place-items: center; padding: 16px; }
.picker .card { width: min(400px, 100%); }
.wallets { display: grid; gap: 8px; }
.wallets .btn { justify-content: flex-start; padding: 11px 14px; gap: 12px; border-radius: var(--r-sm); }
.wallets img { width: 26px; height: 26px; border-radius: 7px; }

@media (max-width: 760px) {
  .prop-head { grid-template-columns: minmax(0, 1fr); }
  .prop-body { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .foot-in { grid-template-columns: minmax(0, 1fr); }
  .c-grid { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .facts div:nth-child(3) { padding-left: 0; border-left: 0; }
  .mark { height: 190px; right: -40px; top: -40px; opacity: 0.12; }
}
@media (max-width: 520px) {
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stats div:last-child { grid-column: 1 / -1; }
  .brand-app { display: none; }
  .brand .logo { height: 26px; }
  .card { padding: 18px; }
  .prop-head { padding: 16px 18px; }
  .hero-in { padding-block: 32px 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .chip.s1::before, .scan .spin, .mark { animation: none; }
  .btn, .prop-title { transition: none; }
}
</style>
</head>
